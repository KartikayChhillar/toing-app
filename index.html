<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00963f">
<title>toing — Food, at your price</title>
<style>
:root{
  --green:#00963f; --green2:#eaf7ee; --green3:#087c39; --pink:#ef3db5;
  --ink:#151515; --muted:#69736d; --line:#e1e7e3; --white:#fff;
  --soft:#f5f7f5; --yellow:#ffd83d; --shadow:0 12px 32px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f1f3f2;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{
  width:min(430px,100vw); min-height:100vh; background:#fff; position:relative;
  box-shadow:0 0 50px rgba(0,0,0,.15); overflow:hidden;
}
.status{height:24px;background:#008c3b;color:#fff;font-size:11px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:700}
.app-header{background:#00963f;color:#fff;padding:9px 14px 14px;position:sticky;top:0;z-index:30}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:39px;line-height:1;font-weight:950;letter-spacing:-3px;color:#fff}
.location{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:235px}
.menu-btn{background:none;color:#fff;border:0;font-size:27px;line-height:1;padding:3px 0}
.search-wrap{margin-top:13px;display:flex;gap:8px}
.search{flex:1;background:#fff;border:0;border-radius:28px;height:54px;padding:0 18px;font-size:16px;outline:none}
.veg-btn{background:#fff;border:1px solid #d8dfda;border-radius:26px;padding:0 13px;font-weight:800;color:#3f6b4d}
.veg-btn.active{background:#d9f6e3;color:#00863b;border-color:#00a44c}
.content{padding-bottom:84px}
.page{display:none}
.page.active{display:block}
.hero{
  background:#00963f;color:#fff;padding:12px 14px 20px;
}
.flash{background:#0a9345;border-radius:20px;padding:20px 20px 25px;min-height:145px;position:relative;overflow:hidden}
.flash small{font-size:13px;font-weight:900}
.flash h1{font-size:36px;line-height:.95;margin:7px 0 12px}
.flash .deal{background:#ffd83d;color:#111;font-weight:900;padding:8px 12px;border-radius:7px;display:inline-block}
.curve{position:absolute;right:22px;top:33px;font-size:46px;color:#ffd83d;transform:rotate(-8deg)}
.category-strip{background:#fff;padding:15px 10px 7px;display:flex;gap:12px;overflow-x:auto;border-bottom:1px solid #eee}
.category-strip::-webkit-scrollbar{height:0}
.cat{min-width:74px;text-align:center;border:0;background:transparent}
.cat-icon{width:58px;height:58px;border-radius:50%;background:#f0f2f0;display:grid;place-items:center;font-size:28px;margin:auto}
.cat.active .cat-icon{background:#00963f;color:#fff}
.cat b{font-size:11px;display:block;margin-top:7px}
.section{padding:14px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-head h2{font-size:21px;margin:0}
.link{border:0;background:none;color:#008d3c;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.food-card{border:1px solid #e3e7e4;border-radius:17px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.food-img{height:145px;background:#e7ece8 center/cover no-repeat;position:relative}
.food-img .veg-dot{position:absolute;left:9px;top:9px;width:18px;height:18px;border:2px solid #158744;background:#fff;border-radius:3px}
.food-body{padding:10px}
.food-name{font-weight:900;font-size:14px;line-height:1.15;min-height:33px}
.meta{font-size:11px;color:#707a74;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-weight:950;font-size:18px}
.add{width:36px;height:32px;border:1.5px solid #00963f;border-radius:18px;background:#fff;color:#00963f;font-weight:900;font-size:19px}
.add:active{transform:scale(.95)}
/* Reels */
.reels{background:#050505;min-height:calc(100vh - 170px);color:#fff;position:relative}
.reel{height:calc(100vh - 170px);min-height:590px;max-height:760px;position:relative;overflow:hidden;background:#111}
.reel-poster{position:absolute;inset:0;background:#1c1c1c center/cover no-repeat}
.reel-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.28),transparent 28%,transparent 55%,rgba(0,0,0,.8))}
.reel-video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;object-fit:cover}
.reel-top{position:absolute;z-index:5;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 1px 5px #000}
.reel-top .tag{background:rgba(0,0,0,.42);padding:7px 10px;border-radius:18px}
.play{
  position:absolute;z-index:6;left:50%;top:45%;transform:translate(-50%,-50%);
  width:72px;height:72px;border-radius:50%;border:1px solid rgba(255,255,255,.8);
  background:rgba(0,0,0,.45);color:#fff;font-size:28px;display:grid;place-items:center
}
.reel-copy{position:absolute;z-index:7;left:16px;right:78px;bottom:88px}
.reel-copy h2{margin:0 0 5px;font-size:27px}
.reel-copy p{margin:0;font-weight:700}
.reel-actions{position:absolute;z-index:8;right:13px;bottom:115px;display:flex;flex-direction:column;gap:12px}
.circle{width:45px;height:45px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:23px}
.circle.liked{background:#ef3db5}
.order-pill{position:absolute;z-index:9;left:14px;right:14px;bottom:20px;background:#fff;color:#111;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 20px rgba(0,0,0,.25)}
.order-pill b{font-size:15px}.order-pill button{background:#00963f;color:#fff;border:0;border-radius:12px;padding:10px 13px;font-weight:900}
.reel-dots{position:absolute;z-index:10;right:7px;top:48%;display:flex;flex-direction:column;gap:5px}.dot{width:4px;height:18px;border-radius:3px;background:#aaa}.dot.active{background:#fff}
/* orders */
.orders{padding:14px;background:#f7f8f7;min-height:calc(100vh - 170px)}
.cart-card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.cart-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.cart-row:last-child{border-bottom:0}
.small{font-size:12px;color:var(--muted)}
.batch-card{background:#eaf7ee;border:1px solid #bce5c8;border-radius:16px;padding:13px;margin-top:12px}
.pickup-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.pickup-select{width:100%;border:1px solid #d9e1dc;border-radius:11px;padding:11px;background:#fff}
.checkout{width:100%;margin-top:12px;border:0;background:#00963f;color:#fff;border-radius:13px;padding:14px;font-weight:900}
.empty{text-align:center;padding:50px 25px}
/* pass */
.pass-page{padding:14px;background:#f5f8f5;min-height:calc(100vh - 170px)}
.pass-hero{background:#00963f;color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}
.pass-hero h2{font-size:30px;margin:6px 0}
.plans{display:grid;gap:12px}
.plan{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.plan.featured{border:2px solid #00963f;box-shadow:0 5px 18px rgba(0,150,63,.14)}
.plan-top{display:flex;justify-content:space-between}.badge{background:#ffd83d;color:#111;border-radius:10px;padding:4px 7px;font-size:10px;font-weight:900}
.plan h3{margin:0;font-size:22px}.amount{font-size:27px;font-weight:950;margin-top:8px}.plan button{margin-top:12px;width:100%;background:#00963f;color:#fff;border:0;padding:11px;border-radius:12px;font-weight:900}
/* search */
.search-page{padding:14px}.search-title{font-size:23px;font-weight:950}.no-results{padding:40px 10px;text-align:center;color:#69736d}
/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100vw);height:76px;background:#fff;border-top:1px solid #e0e5e1;display:grid;grid-template-columns:repeat(4,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{border:0;background:#fff;color:#77817b;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.nav-btn .ico{font-size:23px;line-height:1}.nav-btn.active{color:#00963f}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-card{width:min(390px,100%);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:900}.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.modal-video{aspect-ratio:9/16;background:#000}.modal-video iframe{width:100%;height:100%;border:0}
.modal-foot{padding:14px}.modal-foot button{width:100%;background:#00963f;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:900}
.toast{position:fixed;z-index:200;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){body{background:linear-gradient(135deg,#f2f5f2,#e9efea);padding:24px}.app-shell{border-radius:28px;min-height:calc(100vh - 48px);overflow:hidden}.bottom-nav{bottom:24px;border-radius:0 0 28px 28px}.status{border-radius:28px 28px 0 0}}
</style>

<style id="reel-fix">
/* Reels: real vertical feed, one full-screen card at a time */
#reels { padding:0 !important; }
#reels .reels { height:calc(100vh - 170px); min-height:590px; overflow-y:auto; overflow-x:hidden; scroll-snap-type:y mandatory; scroll-behavior:smooth; background:#050505; }
#reels .reel { height:100%; min-height:590px; max-height:none; margin:0 !important; scroll-snap-align:start; scroll-snap-stop:always; position:relative; overflow:hidden; }
#reels .reel-video { display:block; opacity:0; transition:opacity .2s ease; pointer-events:none; }
#reels .reel.is-playing .reel-video { opacity:1; }
#reels .reel.is-playing .reel-poster { opacity:0; }
#reels .reel .play { display:none; }
#reels .reels::-webkit-scrollbar { width:0; height:0; }
@media (max-width:700px){
  #reels .reels { height:calc(100vh - 92px); min-height:0; }
  #reels .reel { min-height:calc(100vh - 92px); }
}
</style>
</head>
<body>
<div class="app-shell">
  <div class="status"><span>9:41</span><span>● ● ●  ▰</span></div>
  <header class="app-header">
    <div class="header-row">
      <div class="logo">toing</div>
      <div class="location">⌖ Hansraj College, Delhi⌄</div>
      <button class="menu-btn" onclick="toast('Menu opened')">☰</button>
    </div>
    <div class="search-wrap">
      <input id="searchInput" class="search" placeholder="Search dishes & restaurants" oninput="searchFoods(this.value)">
      <button id="vegBtn" class="veg-btn" onclick="toggleVeg()">VEG</button>
    </div>
  </header>

  <main class="content">
    <section id="home" class="page">
      <div class="hero">
        <div class="flash">
          <small>A2Z RESTAURANT</small>
          <h1>FLASH SALE!</h1>
          <span class="deal">STARTING ₹69</span>
          <div class="curve">〰</div>
        </div>
      </div>
      <div class="category-strip">
        <button class="cat active" onclick="filterCat('All',this)"><div class="cat-icon">🍽️</div><b>ALL</b></button>
        <button class="cat" onclick="filterCat('Burgers',this)"><div class="cat-icon">🍔</div><b>BURGERS</b></button>
        <button class="cat" onclick="filterCat('Pizzas',this)"><div class="cat-icon">🍕</div><b>PIZZAS</b></button>
        <button class="cat" onclick="filterCat('Biryani',this)"><div class="cat-icon">🍛</div><b>BIRYANI</b></button>
        <button class="cat" onclick="filterCat('Wraps',this)"><div class="cat-icon">🌯</div><b>WRAPS</b></button>
        <button class="cat" onclick="filterCat('Noodles',this)"><div class="cat-icon">🍜</div><b>NOODLES</b></button>
      </div>
      <div class="section">
        <div class="section-head"><h2>Meals under ₹99</h2><button class="link" onclick="filterPrice()">View all ›</button></div>
        <div id="foodGrid" class="grid"></div>
      </div>
      <div class="section">
        <div class="section-head"><h2>Popular near you</h2><span class="small">30–40 min</span></div>
        <div id="popularGrid" class="grid"></div>
      </div>
    </section>

    <section id="reels" class="page active">
      <div class="reels">
        <div id="reelHost"></div>
      </div>
    </section>

    <section id="orders" class="page">
      <div class="orders">
        <div class="section-head"><h2>Your order</h2><span id="cartCount" class="small">0 items</span></div>
        <div id="cartBox"></div>
      </div>
    </section>

    <section id="pass" class="page">
      <div class="pass-page">
        <div class="pass-hero">
          <div style="font-weight:900;font-size:12px;opacity:.8">TOING PASS</div>
          <h2>Save more, eat better.</h2>
          <p style="margin:0;opacity:.9">Recurring meals, predictable pickup windows and better value for everyday orders.</p>
        </div>
        <div class="plans" id="plans"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-page="home" onclick="showPage('home')"><span class="ico">⌂</span>Home</button>
    <button class="nav-btn active" data-page="reels" onclick="showPage('reels')"><span class="ico">▶</span>Reels</button>
    <button class="nav-btn" data-page="orders" onclick="showPage('orders')"><span class="ico">▣</span>Orders</button>
    <button class="nav-btn" data-page="pass" onclick="showPage('pass')"><span class="ico">✦</span>Pass</button>
  </nav>
</div>

<div id="toast" class="toast"></div>

function imgWithFallback(src, fallback){

function renderFoods(){
  const q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  let list=foods.filter(f=>
    (activeCat==='All'||f.cat===activeCat) &&
    (!vegOnly||f.veg) &&
    (!q || (f.name+' '+f.rest+' '+f.cat).toLowerCase().includes(q))
  );
  const grid=document.getElementById('foodGrid');
  grid.innerHTML=list.filter(f=>f.price<=99).map(foodCard).join('') || `<div class="no-results" style="grid-column:1/-1">No meals found. Try another search.</div>`;
  document.getElementById('popularGrid').innerHTML=foods.filter(f=>f.veg).slice(0,4).map(foodCard).join('');
}
function foodCard(f){
 return `<article class="food-card">
   <div class="food-img" style="${imgWithFallback(f.img,ASSETS.hero)}">
     ${f.veg?'<span class="veg-dot"></span>':''}
   </div>
   <div class="food-body">
     <div class="food-name">${f.name}</div>
     <div class="meta">${f.rest} · ★4.4 · 30–40 mins</div>
     <div class="price-row"><span class="price">₹${f.price}</span><button class="add" onclick="addToCart('${esc(f.name)}',${f.price})">+</button></div>
   </div>
 </article>`;
}
function esc(s){return s.replace(/'/g,"&#39;")}

let reelObserver=null;
function setupReelAutoplay(){
 if(reelObserver) reelObserver.disconnect();
 const container=document.querySelector('#reels .reels');
 const cards=[...document.querySelectorAll('#reels .reel')];
 if(!container || !cards.length) return;
 reelObserver=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
     const card=entry.target;
     const video=card.querySelector('.reel-video');
     if(entry.isIntersecting && entry.intersectionRatio>=0.65){
       cards.forEach(other=>{ if(other!==card) stopReelCard(other); });
       card.classList.add('is-playing');
       const i=Number(card.dataset.reelIndex);
       reelIndex=i;
       if(video){
         if(!video.src) video.src=video.dataset.src;
         video.muted=true;
         const p=video.play();
         if(p && p.catch) p.catch(()=>{});
       }
     } else if(!entry.isIntersecting){
       stopReelCard(card);
     }
   });
 },{root:container,threshold:[0.65]});
 cards.forEach(c=>{
   reelObserver.observe(c);
   const video=c.querySelector('.reel-video');
   if(video){
     video.addEventListener('click',()=>{
       video.muted=!video.muted;
       if(video.paused) video.play().catch(()=>{});
     });
   }
 });
 requestAnimationFrame(()=>{ cards[0].scrollIntoView({block:'start'}); });
}
function stopReelCard(card){
 card.classList.remove('is-playing');
 const video=card.querySelector('.reel-video');
 if(video){ video.pause(); }
}
function playSpecificReel(i){
 const cards=[...document.querySelectorAll('#reels .reel')];
 if(!cards[i]) return;
 document.getElementById('reels').classList.add('active');
 cards[i].scrollIntoView({behavior:'smooth',block:'start'});
 setTimeout(()=>{
   const video=cards[i].querySelector('.reel-video');
   if(video){
     if(!video.src) video.src=video.dataset.src;
     video.muted=true;
     video.play().catch(()=>{});
     cards[i].classList.add('is-playing');
   }
 },450);
}
function scrollToReel(i){
 const cards=[...document.querySelectorAll('#reels .reel')];
 const target=cards[Math.min(i,cards.length-1)];
 if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
}
function playReel(){playSpecificReel(reelIndex)}
function nextReel(){scrollToReel(reelIndex+1)}

 const box=document.getElementById('cartBox');
 document.getElementById('cartCount').textContent=`${cart.length} item${cart.length===1?'':'s'}`;
 if(!cart.length){
   box.innerHTML=`<div class="cart-card empty"><div style="font-size:48px">🛍️</div><h3>Your batch is empty</h3><p class="small">Discover affordable meals on Home or Reels.</p><button class="checkout" onclick="showPage('reels')">Open Reels</button></div>`;
   return;
 }
 const total=cart.reduce((s,x)=>s+x.price,0);
 box.innerHTML=`<div class="cart-card">${cart.map((x,i)=>`<div class="cart-row"><span><b>${x.name}</b><div class="small">Cluster pickup · 15–20 min window</div></span><strong>₹${x.price}</strong></div>`).join('')}
   <div class="batch-card"><b>Batch forming</b><div class="small" style="margin-top:5px">${cart.length} order${cart.length===1?'':'s'} currently grouped. Add nearby meals to strengthen the batch.</div></div>
 </div>
 <div class="pickup-card"><b>Choose pickup point</b><select class="pickup-select" id="pickup"><option>Hansraj College — Gate 2</option><option>Kamla Nagar — Cluster Node</option><option>Metro-linked Society Node</option></select><div class="small" style="margin-top:7px">Estimated ready time: 15–20 minutes</div></div>
 <div class="cart-card"><div class="price-row"><span class="price">Total</span><span class="price">₹${total}</span></div><button class="checkout" onclick="confirmOrder()">Confirm cluster pickup</button></div>`;
}

  ['Lite','1 meal/day','30 meals / month','₹2,250','₹75 / meal','20.7%'],
  ['Standard','2 meals/day','60 meals / month','₹4,320','₹72 / meal','17.4%'],
  ['Full','3 meals/day','90 meals / month','₹6,120','₹68 / meal','12.6%']
 ].map((p,i)=>`<div class="plan ${i===1?'featured':''}">
   <div class="plan-top"><h3>${p[0]}</h3>${i===1?'<span class="badge">RECOMMENDED</span>':''}</div>
   <div class="small">${p[1]}</div><div class="amount">${p[3]}</div>

   <div style="margin-top:10px;font-weight:900;color:#008d3c">Contribution margin ${p[5]}</div>
   <button onclick="subscribe('${p[0]}')">Choose ${p[0]}</button>
 </div>`).join('');
}
function subscribe(plan){toast(`${plan} Toing Pass selected — demo checkout`)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),1800)}

renderFoods();renderPass();renderReel();
